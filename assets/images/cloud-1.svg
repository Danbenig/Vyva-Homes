<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 320" preserveAspectRatio="none" width="100%" height="100%">
  <defs>
    <!-- Organic blur filters for soft cloudy edges -->
    <filter id="cloudSoftBlur" x="-10%" y="-30%" width="120%" height="160%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="12" />
    </filter>
    <filter id="cloudDeepBlur" x="-10%" y="-30%" width="120%" height="160%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="22" />
    </filter>
    <linearGradient id="cloudGrad1" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#090a0d" stop-opacity="1"/>
      <stop offset="60%" stop-color="#0d0f15" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#141720" stop-opacity="0.8"/>
    </linearGradient>
    <linearGradient id="cloudGrad2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0c0e13" stop-opacity="0.9"/>
      <stop offset="80%" stop-color="#12151d" stop-opacity="0.75"/>
      <stop offset="100%" stop-color="#181c26" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Deep background cloud base -->
  <path d="M 0 0 L 0 160 C 140 190 260 110 420 150 C 580 190 700 120 860 160 C 1020 200 1180 130 1340 170 C 1500 210 1660 140 1800 175 L 1920 160 L 1920 0 Z" fill="url(#cloudGrad1)" filter="url(#cloudDeepBlur)"/>

  <!-- Organic Cloud Mid-layer with puff waves -->
  <path d="M 0 0 L 0 130 Q 110 60 230 100 T 470 90 T 710 130 T 960 85 T 1200 125 T 1440 90 T 1680 120 T 1920 105 L 1920 0 Z" fill="url(#cloudGrad1)" filter="url(#cloudSoftBlur)" opacity="0.95"/>

  <!-- Crisp front cloud crest -->
  <path d="M 0 0 L 0 95 C 160 145 310 75 490 115 C 670 155 830 85 1010 120 C 1190 155 1370 95 1550 125 C 1720 150 1820 105 1920 115 L 1920 0 Z" fill="url(#cloudGrad2)" opacity="0.85"/>
</svg>
